name: Journalist agent (feed drafting)

# Free scheduler for The Forex Republic's digital-journalist agent.
# GitHub Actions cron (UTC) triggers the deployed endpoint every 3 hours
# (8 runs/day); the endpoint drafts REVIEW-only articles from public feeds
# across every beat (forex, crypto, commodities, equities, macro) for human
# review. Nothing here publishes: see breaking-cron.yml for the narrow
# confirmed-event lane.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL        e.g. https://your-app.vercel.app  (no trailing slash)
#   PUBLISH_API_KEY same value as the PUBLISH_API_KEY env var in Vercel
#
# Optional secret (needed only if Vercel Deployment Protection is enabled):
#   VERCEL_AUTOMATION_BYPASS_SECRET  from Vercel -> Settings -> Deployment
#     Protection -> "Protection Bypass for Automation". When set, it is sent
#     as the x-vercel-protection-bypass header so this server-to-server call
#     isn't redirected to Vercel's login page.
#
# Note: GitHub's scheduled runs can be delayed by a few minutes under load,
# and only run from the default branch. You can also trigger it manually via
# the "Run workflow" button (workflow_dispatch).

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journalist-cron
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger feed drafting
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          PUBLISH_API_KEY: ${{ secrets.PUBLISH_API_KEY }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$PUBLISH_API_KEY" ]; then
            echo "::error::SITE_URL and PUBLISH_API_KEY repository secrets must be set."
            exit 1
          fi
          url="${SITE_URL%/}/api/cron/draft-from-feeds"
          echo "POST $url"
          bypass_args=()
          if [ -n "$VERCEL_BYPASS" ]; then
            bypass_args=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS")
          fi
          # -L follows redirects (a 308 preserves the POST method + body), which
          # handles host/trailing-slash canonicalization on the way to the API.
          code=$(curl -sSL -o response.json -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "x-api-key: $PUBLISH_API_KEY" \
            "${bypass_args[@]}" \
            "$url")
          echo "HTTP $code"
          cat response.json || true
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Feed drafting endpoint returned HTTP $code"
            exit 1
          fi
          # Guard against a redirect landing on a login/HTML page (a 200 that
          # isn't our API). The endpoint always returns JSON with an "ok" field.
          if ! grep -q '"ok"' response.json; then
            echo "::error::Endpoint did not return the expected JSON (likely a login/protection page). If Vercel Deployment Protection is on, set the VERCEL_AUTOMATION_BYPASS_SECRET repo secret."
            exit 1
          fi
